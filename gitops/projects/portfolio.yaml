apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
  # Single portfolio project for BOTH apps. Namespaces are whitelisted per
  # cluster role — nothing outside them can be synced, so a bad manifest path
  # cannot touch kube-system or argocd itself.
spec:
  description: Portfolio GitOps (P01 FlashSale + P02 LegacyApp, prod only)
  sourceRepos:
    - 'https://github.com/imtarget05/FlashSale-Backend.git'
    - 'https://github.com/imtarget05/Productionized-LegacyApp.git'
  destinations:
    - namespace: flashsale
      server: 'https://kubernetes.default.svc'
    - namespace: legacyapp
      server: 'https://kubernetes.default.svc'
  # Explicit namespaced allowlist. KEDA's ScaledObject is local-only but remains
  # constrained to the two destination namespaces above. No cluster-scoped app
  # resources are permitted.
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: keda.sh
      kind: ScaledObject
  # - roles[] intentionally ABSENT: single-operator portfolio, no team RBAC to
  #   model yet. Add per-team roles only when a second operator exists.