apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-hub
  namespace: argocd
  labels:
    app.kubernetes.io/name: agent-hub
    app.kubernetes.io/part-of: agent-hub-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: https://github.com/imtarget05/AKS-SRE-Platform.git
    targetRevision: main
    path: kubernetes/apps/agent-hub
  destination:
    server: https://aksportfoliodev-vqv8uki1.hcp.eastasia.azmk8s.io:443
    namespace: agent-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m