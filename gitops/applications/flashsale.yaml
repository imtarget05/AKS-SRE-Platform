apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flashsale
  namespace: argocd
  # Single overlay per app: prod. No dev/staging overlays exist in P01 — the
  # Application must not invent a path that has no source of truth.
spec:
  project: portfolio
  source:
    repoURL: 'https://github.com/imtarget05/FlashSale-Backend.git'
    path: 'infrastructure/kubernetes/overlays/prod'
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: flashsale
  syncPolicy:
    # Sync-waves order the rollout INSIDE this Application: schema first, then
    # workloads. Without the hook, Deployment replicas race the migration.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m