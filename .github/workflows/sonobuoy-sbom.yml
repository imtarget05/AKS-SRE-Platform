name: Source SBOM and Dependency Scan

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository has no maintained application image build context.
      # The deployed image SBOM is produced by aks-deploy.yml at apply time.
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: source-sbom.spdx.json
          artifact-name: source-sbom-${{ github.sha }}

      - name: Require nonempty SBOM
        run: test -s source-sbom.spdx.json

      - name: Install Trivy (pinned and checksummed)
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL --proto '=https' --tlsv1.2 -o "$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" trivy
          sudo mv trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy

      - name: Scan source dependencies for critical vulnerabilities
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            --ignore-unfixed \
            --skip-dirs .git,.terraform,node_modules,docs/portfolio-archive \
            --ignorefile .trivyignore \
            .
