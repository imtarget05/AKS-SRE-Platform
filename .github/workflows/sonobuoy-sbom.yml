name: SBOM & Provenance Scan

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No legacy-app image exists in either portfolio ACR (acrflashsalep6 /
      # crportfolioa3deec), so this workflow builds the image from source and
      # scans the local tag — same contract as legacyapp-ci docker-build-scan.
      - name: Build legacy-app image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/legacy-inventory
          file: ./apps/legacy-inventory/Dockerfile
          push: false
          load: true
          tags: legacy-app:ci-${{ github.sha }}

      - name: Scan image with Syft for SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: legacy-app:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Generate SBOM Provenance
        run: |
          set -euo pipefail
          test -s sbom.spdx.json || { echo "SBOM file missing/empty" >&2; exit 1; }
          echo "SBOM generated at $(date)" >> sbom-provenance.txt
          jq '.packages | length' sbom.spdx.json > component-count.txt

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: legacy-app:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-legacy-app-scan

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v4.1.2

      # COSIGN_PRIVATE_KEY is not configured on this repo yet; sign/verify is
      # skipped with an explicit message (same never-faked contract as Sonar).
      - name: Cosign Sign SBOM
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "COSIGN_PRIVATE_KEY not configured — cosign sign/verify SKIPPED (not faked)"
            exit 0
          fi
          cosign sign --key env://COSIGN_PRIVATE_KEY sbom.spdx.json
          cosign verify --key env://COSIGN_PRIVATE_KEY sbom.spdx.json

      - name: Fail on Critical CVEs
        run: |
          critical_count=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
          echo "Critical (unfixed) CVEs reported by Trivy: ${critical_count}"
          if [ "${critical_count}" -gt 0 ]; then
            echo "::error::Critical CVEs found in image scan (${critical_count})" >&2
            exit 1
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom-provenance.txt
            component-count.txt
          retention-days: 30
