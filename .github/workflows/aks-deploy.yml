name: AKS Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  # =========================================================================
  # 1. Terraform Plan (dispatch only; destroy also produces a saved plan)
  # =========================================================================
  plan:
    name: Terraform Plan & Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      plan_hash: ${{ steps.fingerprint.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check OIDC Credentials Availability
        id: oidc-check
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "has_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_oidc=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.action }}" != "plan" ]; then
              echo "::error::Destructive dispatch requires Azure OIDC credentials."
              exit 1
            fi
            echo "::notice::AZURE_CLIENT_ID not present in this runner context; falling back to offline validation."
          fi

      - name: Azure Login (OIDC)
        if: steps.oidc-check.outputs.has_oidc == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Format Check
        run: |
          cd terraform/aks-foundation
          terraform fmt -check -recursive

      - name: Terraform Init (Offline if no OIDC, remote backend if OIDC available)
        run: |
          cd terraform/aks-foundation
          if [ "${{ steps.oidc-check.outputs.has_oidc }}" = "true" ]; then
            terraform init -upgrade -backend-config=backend-remote.tfbackend -reconfigure
          else
            terraform init -backend=false
            terraform validate
          fi

      - name: Terraform Plan
        if: steps.oidc-check.outputs.has_oidc == 'true'
        run: |
          cd terraform/aks-foundation
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi
          chmod 600 tfplan

      # The repository is public. A Terraform plan can contain secret values;
      # publish only a digest and allowlisted non-secret change summary for approval.
      - name: Publish plan fingerprint and action summary
        id: fingerprint
        if: steps.oidc-check.outputs.has_oidc == 'true'
        run: |
          cd terraform/aks-foundation
          PLAN_HASH=$(terraform show -json tfplan | python3 ../../scripts/terraform-plan-fingerprint.py)
          echo "plan_hash=$PLAN_HASH" >> "$GITHUB_OUTPUT"
          {
            echo "### Reviewed Terraform ${{ github.event.inputs.action }} plan"
            echo "Commit: $GITHUB_SHA"
            echo "Fingerprint: $PLAN_HASH"
            terraform show -json tfplan | python3 ../../scripts/terraform-plan-summary.py
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 1b. SBOM + Provenance + Image Scan Gate
  # =========================================================================
  sbom-scan:
    name: SBOM + Provenance + Image Scan
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Determine image reference
        id: image-ref
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/legacy-app:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Install syft (SBOM generator)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM (SPDX JSON)
        id: sbom
        run: |
          syft "${{ steps.image-ref.outputs.image }}" -o spdx-json=sbom.spdx.json
          echo "sbom_path=sbom.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Install trivy (pinned + checksummed)
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL --proto '=https' --tlsv1.2 -o "$ASSET" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${TRIVY_SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" trivy
          sudo mv trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
          trivy --version

      - name: Trivy image scan (CRITICAL blocks)
        id: trivy-scan
        run: |
          set -euo pipefail
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            "${{ steps.image-ref.outputs.image }}"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Verify image digest
        id: digest
        run: |
          DIGEST=$(az acr manifest list-metadata --registry ${{ vars.ACR_NAME }} \
            --name legacy-app --query "[?tags[0]=='${GITHUB_SHA}'].digest | [0]" -o tsv)
          echo "legacy-app ${GITHUB_SHA} → ${DIGEST}"
          [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ] || { echo "legacy-app:$GITHUB_SHA not found in ACR"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Record image digest in summary
        run: |
          {
            echo "### Image Scan Gate"
            echo "Image: ${{ steps.image-ref.outputs.image }}"
            echo "Digest: ${{ steps.digest.outputs.digest }}"
            echo "SBOM: SPDX JSON (artifact: sbom-${{ github.sha }})"
            echo "Trivy: CRITICAL scan — PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 2. Terraform Apply (Gated by 'production' Environment & Manual Approval)
  # =========================================================================
  apply:
    name: Terraform Apply (Protected)
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The environment gate is managed in GitHub settings. Check its live
      # configuration after approval and before obtaining Azure credentials.
      - name: Verify independent production review configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" |
            python3 scripts/check-production-environment.py

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Init (with Azure backend)
        run: |
          cd terraform/aks-foundation
          terraform init -upgrade -backend-config=backend-remote.tfbackend -reconfigure

      - name: Replan, verify reviewed fingerprint, then apply
        run: |
          cd terraform/aks-foundation
          terraform plan -out=tfplan
          CURRENT_HASH=$(terraform show -json tfplan | python3 ../../scripts/terraform-plan-fingerprint.py)
          if [[ -z "${{ needs.plan.outputs.plan_hash }}" || "$CURRENT_HASH" != "${{ needs.plan.outputs.plan_hash }}" ]]; then
            echo "FATAL: current plan differs from reviewed plan; dispatch a new plan." >&2
            exit 1
          fi
          terraform apply tfplan

      - name: Bootstrap Argo CD
        run: |
          RESOURCE_GROUP=$(cd terraform/aks-foundation && terraform output -raw resource_group_name)
          CLUSTER_NAME=$(cd terraform/aks-foundation && terraform output -raw aks_cluster_name)
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER_NAME" --overwrite-existing
          ./scripts/bootstrap.sh
          kubectl get applications -n argocd

  # =========================================================================
  # 3. Terraform Destroy (Gated by 'production' Environment & Manual Approval)
  # =========================================================================
  destroy:
    name: Terraform Destroy (Protected)
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify independent production review configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" |
            python3 scripts/check-production-environment.py

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Init (with Azure backend)
        run: |
          cd terraform/aks-foundation
          terraform init -upgrade -backend-config=backend-remote.tfbackend -reconfigure

      - name: Apply saved destroy plan only
        run: |
          cd terraform/aks-foundation
          terraform plan -destroy -out=tfplan
          CURRENT_HASH=$(terraform show -json tfplan | python3 ../../scripts/terraform-plan-fingerprint.py)
          if [[ -z "${{ needs.plan.outputs.plan_hash }}" || "$CURRENT_HASH" != "${{ needs.plan.outputs.plan_hash }}" ]]; then
            echo "FATAL: current destroy plan differs from reviewed plan; dispatch a new plan." >&2
            exit 1
          fi
          terraform apply tfplan
