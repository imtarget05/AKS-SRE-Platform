name: pr-gate

# Pull requests and pushes to main run the same gates: a control that only runs
# on PR can be bypassed by pushing directly to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.5"
  # setup-tflint requires a semver tflint version. v0.59.1 does not exist; the
  # current release line is v0.6x.
  TFLINT_VERSION: "v0.64.0"
  KUBECONFORM_VERSION: "v0.8.0"
  # Verified against the release CHECKSUMS file on 2026-10-02. A pinned version
  # with no checksum is only pinned against typos, not against substitution.
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  PYTHON_VERSION: "3.12"

jobs:
  terraform:
    name: terraform (fmt, init, validate, test, tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aks-foundation
    env:
      # Every terraform root that owns a *.tftest.hcl, repository-relative.
      # `terraform test` only executes the CURRENT module's tests/ directory,
      # so a job that stays in terraform/aks-foundation asserts 2 of the 5 run
      # blocks and the two module suites are never executed by any CI step.
      # tests/test_gates.py (G10) asserts this list against the repository, so
      # a new module cannot be added without being wired in here.
      TERRAFORM_TEST_ROOTS: |
        terraform/aks-foundation
        terraform/modules/acr_attachment
        terraform/modules/aks_cluster
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # fmt runs across the WHOLE repository, so a new root outside
      # terraform/aks-foundation cannot dodge formatting.
      - name: fmt (whole repo, recursive)
        working-directory: .
        run: terraform fmt -check -recursive

      # -backend=false keeps PR validation offline: no remote state, no Azure
      # credentials, no dependency on a storage account being reachable.
      - name: init (backend disabled, offline-safe)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      # tflint runs BEFORE the native-test step. A failing step must not hide the
      # controls after it: with the original order the tflint steps were reported
      # as "skipped" on every run, so a lint regression would have been invisible
      # for as long as the test step stayed red.
      - uses: terraform-linters/setup-tflint@6770de8d186019a148cc2b144e8bfa627f7d4aa8 # v5
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # Plugin cache. tflint installs third-party rulesets under
      # ~/.tflint.d/plugins. setup-tflint v5 (the pinned version) exposes no
      # plugin-cache input, so the cache is declared here, exactly as the
      # setup-tflint README documents it. The key hashes terraform/.tflint.hcl,
      # so a change to the pinned ruleset version cannot be served from a
      # stale cache, and runner.os keeps a Linux binary out of a macOS runner.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-plugins-${{ hashFiles('terraform/.tflint.hcl') }}

      # --init installs the pinned AzureRM ruleset declared in
      # terraform/.tflint.hcl. It is a SEPARATE step from the lint: tflint
      # refuses to run a plugin it has not installed, so the lint would fail
      # with "plugin not found" on a cold runner instead of with a lint
      # finding. GITHUB_TOKEN avoids the unauthenticated GitHub API rate
      # limit (60/hour/IP) that a shared CI address can hit.
      #
      # The retry is deliberate, not defensive noise: tflint verifies the
      # plugin's signature through the sigstore TUF root, and that fetch
      # failed with "connection reset by peer" on 1 of 5 cold installs here.
      # Retrying keeps the signature verification (nothing is downgraded to
      # signature = "none") and turns a network blip into a slower step
      # instead of a red job. A genuinely missing plugin fails all three
      # attempts and the job goes red with the real error.
      - name: tflint init (pinned azurerm plugin)
        working-directory: terraform
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if tflint --init --config "$(pwd)/.tflint.hcl"; then
              exit 0
            fi
            echo "::warning::tflint --init failed (attempt ${attempt}/3); retrying"
            sleep 5
          done
          echo "::error::tflint --init failed after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Lint from the terraform/ ROOT so every root below it is covered:
      # aks-foundation, modules/aks_cluster, modules/acr_attachment, legacy
      # and data-protection. Running from a single root left the other three
      # roots unlinted.
      #
      # --config is an ABSOLUTE path on purpose. Measured on this tree with
      # tflint v0.64.0: an absolute path loads the AzureRM ruleset in every
      # root (rc=0, 0 issues); a relative path HARD FAILS in all 9
      # subdirectories ("Failed to load TFLint config", rc=1); NO --config at
      # all makes the subdirectories silently fall back to the bundled
      # terraform ruleset, where an AzureRM finding (a resource missing its
      # tags) is MISSED (rc=0). Only the absolute path both loads the ruleset
      # everywhere and keeps a missing ruleset loud.
      - name: tflint (recursive, every terraform root)
        working-directory: terraform
        run: tflint --recursive --config "$(pwd)/.tflint.hcl" --format=compact

      # Truthful native-test accounting. Zero tests is reported as
      # NOT_IMPLEMENTED and fails this step on purpose: `terraform test` exiting 0
      # with "0 passed, 0 failed" is not verification, and letting it through is
      # how an empty suite gets mistaken for a green one.
      #
      # Every root that owns a *.tftest.hcl is executed, not only the one the
      # job happens to sit in: `terraform test` runs the CURRENT module's
      # tests/ directory and nothing else, so a single-root run asserts 2 of
      # the 5 run blocks and the two module suites stay invisible. The step
      # walks TERRAFORM_TEST_ROOTS, prints the per-root count, and the guard
      # below is evaluated against the TOTAL across all roots (5 today), not
      # against one root.
      #
      # Phase D resolved the computed-block blocker cleanly: the ACR role assignment
      # boundary is decoupled into `modules/acr_attachment` and the cluster foundation
      # into `modules/aks_cluster`, without fake mock fallbacks. `terraform test`
      # evaluates semantic assertions against the offline mock provider.
      #
      # if: always() is the other half of the comment above the tflint steps.
      # That comment states the rule: a failing step must not hide the controls
      # after it. Moving tflint before this step stopped the TEST failure from
      # hiding the LINT control, but a failing LINT step would then hide THIS
      # control, which is the same blindness with the arrow reversed. always()
      # runs this step whatever happened above it; the job still fails when
      # either step fails, so no control is weakened.
      - name: terraform test (every test root)
        if: always()
        working-directory: .
        run: |
          set -uo pipefail
          # The roots below are repository-relative and the job default
          # working-directory is terraform/aks-foundation, so anchor at the
          # repository root before walking them.
          cd "${GITHUB_WORKSPACE:-$PWD}"
          : > terraform-test.log
          TOTAL=0
          FAILED=0
          for root in ${TERRAFORM_TEST_ROOTS}; do
            log="terraform-test-$(printf '%s' "$root" | tr '/' '-').log"
            echo "::group::terraform test $root"
            ( cd "$root" && terraform init -backend=false -input=false && terraform test ) > "$log" 2>&1
            rc=$?
            cat "$log"
            echo "::endgroup::"
            cat "$log" >> terraform-test.log
            count=$(grep -oE '[0-9]+ passed' "$log" | tail -1 | grep -oE '[0-9]+' || echo 0)
            echo "TERRAFORM_TEST_PASSED[$root]=$count"
            TOTAL=$((TOTAL + count))
            if [ "$rc" -ne 0 ]; then
              FAILED=1
              echo "::error title=TERRAFORM_NATIVE_TESTS=FAILED::$root exited $rc"
            fi
            if [ "$count" -eq 0 ]; then
              FAILED=1
              echo "::error title=TERRAFORM_NATIVE_TESTS=NOT_IMPLEMENTED::$root contributed 0 passing assertions"
            fi
          done
          echo "TERRAFORM_TEST_TOTAL=$TOTAL"
          echo "TERRAFORM_TEST_PASSED=$TOTAL" >> "$GITHUB_ENV"
          if [ "${TOTAL:-0}" -eq 0 ]; then
            echo "::error title=TERRAFORM_NATIVE_TESTS=NOT_IMPLEMENTED::"
            echo "terraform test collected 0 passing assertions across every root."
            echo "Terraform behaviour is NOT VERIFIED and must not be claimed."
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=TERRAFORM_NATIVE_TESTS=FAILED::"
            echo "at least one terraform test root failed. See terraform-test*.log."
            exit 1
          fi

      # The logs are uploaded from the job that PRODUCES them. Each job runs on
      # its own runner with its own checkout, so an upload step in another job
      # would look for files that were never written there.
      - name: upload terraform test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-test-log
          path: terraform-test*.log
          if-no-files-found: ignore

  kubernetes:
    name: kubernetes (render, schema, inventory, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # -f so a 404 or an HTML error page is a hard failure instead of a
      # tarball-shaped file that fails two lines later with a confusing message.
      # The checksum is verified against the release CHECKSUMS file: a pinned
      # version without one is only pinned against typos.
      - name: install kubeconform (pinned + checksummed)
        run: |
          set -euo pipefail
          # --proto '=https' because SonarCloud rule githubactions:S6506 is right
          # about it: curl follows redirects by default, so an https URL can be
          # redirected to http. Pinning the protocol closes that, independently of
          # the checksum that follows.
          curl -sfL --proto '=https' --tlsv1.2 -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: render every maintained kustomize root
        run: |
          set -euo pipefail
          found=0
          while read -r f; do
            found=1
            d="$(dirname "$f")"
            echo "::group::kustomize build $d"
            kubectl kustomize "$d"
            echo "::endgroup::"
          done < <(find . -name kustomization.yaml -not -path './.git/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::no kustomization.yaml found anywhere in the repository"
            exit 1
          fi

      # Schema validation on the same rendered roots. CRD and add-on kinds are
      # skipped because they have no schema at a fixed Kubernetes version; the
      # Argo and KEDA contract is covered by the gitops-validate workflow.
      - name: kubeconform
        run: |
          set -euo pipefail
          while read -r f; do
            d="$(dirname "$f")"
            echo "::group::kubeconform $d"
            kubectl kustomize "$d" | kubeconform \
              -kubernetes-version 1.36.0 \
              -strict -summary \
              -skip ServiceMonitor,PrometheusRule,GrafanaDashboard,EnvoyProxy,GatewayClass,HTTPRoute,Gateway,ScaledObject,TriggerAuthentication,AppProject,Application
            echo "::endgroup::"
          done < <(find . -name kustomization.yaml -not -path './.git/*' | sort)

      - name: manifest inventory (no orphans)
        run: python3 gitops/validate-gitops.py

      - name: static policy and image gate
        run: python3 scripts/policy-gate.py

  security:
    name: security (trivy config + filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The action bundled an install script that fetched trivy v0.65.0 from its
      # own source and failed on the runner three runs in a row before any scan
      # executed. A security scanner whose failure mode is "the job goes red and
      # nothing is scanned" provides no security at all.
      #
      # The binary is downloaded and checksum-verified instead. SonarCloud
      # flagged the previous `curl | sh` as githubactions:S8482 (BLOCKER,
      # "executing downloaded artifacts directly without verification"), which is
      # correct: piping an install script into a shell is exactly the pattern that
      # rule exists for. The checksum below is the published value from
      # trivy_0.74.0_checksums.txt, so the CI scan runs the same binary the
      # .trivyignore entries were validated against.
      - name: install trivy (pinned + checksummed)
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL --proto '=https' --tlsv1.2 -o "$ASSET" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ASSET}"
          echo "${TRIVY_SHA256}  ${ASSET}" | sha256sum -c -
          tar xzf "$ASSET" trivy
          sudo mv trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
          trivy --version

      # IaC/config scan only. No container image is built in Phase B, so an image
      # scan here would be scanning nothing. It arrives with the Phase O pipeline.
      # The fs scan runs the secret scanner only; misconfig is already covered by
      # the config scan, and duplicating it reports the same findings twice.
      - name: trivy config (IaC + manifests)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            --skip-dirs .git,.terraform,docs/portfolio-archive \
            --ignorefile .trivyignore \
            .

      - name: trivy fs (secrets)
        run: |
          set -euo pipefail
          trivy fs \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            --skip-dirs .git,.terraform,node_modules,docs/portfolio-archive \
            .

  python:
    name: python gates (validator test matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Explicit interpreter and explicit dependency install. The workflow never
      # inherits a developer's virtualenv: on the authoring machine `python3`
      # resolves into a sibling project's .venv.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: >-
          pip install --require-hashes --only-binary ':all:' -r requirements.lock

      - name: gate test matrix (G1-G15)
        run: python3 tests/test_gates.py

      - name: cloud cutover guard unit tests
        run: python3 -m unittest discover -s tests -p test_cloud_cutover.py

      - name: Azure origin renderer unit tests
        run: python3 -m unittest discover -s tests -p test_azure_origin.py

      - name: origin mTLS positive and negative controls
        run: python3 -m unittest discover -s tests -p test_origin_mtls_contract.py

      - name: protected Terraform destroy contract
        run: python3 -m unittest discover -s tests -p test_destroy_workflow.py

      - name: Cloudflare API edge contract
        run: node --test platform/cloudflare/api-edge/test/*.test.mjs

  agent-hub:
    name: agent-hub (evals, schemas, hitl execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install agent-hub dependencies
        run: pip install -r apps/agent-hub/requirements.txt

      - name: run agent-hub evals and tests
        run: pytest apps/agent-hub/tests apps/agent-hub/tests/evals -v
