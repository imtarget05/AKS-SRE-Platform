<line x1="60" y1="1300" x2="2340" y2="1300" stroke="#d2dfe9" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="1330" font-size="17" fill="#52677a" font-weight="400" text-anchor="start" class="">Ranh giới đọc/ghi là policy tại domain service. Đường nét đứt là contract WIP, không phải luồng production đã chạy.</text>
