<text x="96" y="1096" font-size="22" fill="#10263b" font-weight="400" text-anchor="start" class="">Cross-scope → 403/404. Tool timeout / source conflict / không có citation → abstained + unknowns.</text>
<text x="96" y="1134" font-size="22" fill="#10263b" font-weight="400" text-anchor="start" class="">Agent Hub hiện là WIP trong monorepo; demo Kind và test synthetic không chứng minh tích hợp production.</text>
