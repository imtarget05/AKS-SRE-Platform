    <path d="M 1144 180 H 1566 Q 1590 180 1590 204 V 271 H 1120 V 204 Q 1120 180 1144 180 Z" fill="#e6f6eb"/>
  </g>
  <circle cx="1165" cy="226" r="26" fill="#39a472"/>
  <text x="1146" y="234" font-size="19" font-weight="800" fill="white">QK</text>
  <text x="1205" y="219" class="card-title">QuanLyKho</text>
