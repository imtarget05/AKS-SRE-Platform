  <g filter="url(#shadow)">
    <rect x="590" y="180" width="470" height="372" rx="24" fill="#fff" stroke="#f4d0ae" stroke-width="2"/>
    <path d="M 614 180 H 1036 Q 1060 180 1060 204 V 271 H 590 V 204 Q 590 180 614 180 Z" fill="#fff0df"/>
  </g>
  <circle cx="635" cy="226" r="26" fill="#e4913f"/>
