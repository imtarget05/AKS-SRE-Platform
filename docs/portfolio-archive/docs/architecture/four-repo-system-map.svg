  <g filter="url(#shadow)"><rect x="60" y="664" width="750" height="211" rx="24" fill="#eaf9fa" stroke="#83cbd2" stroke-width="2"/></g>
  <circle cx="105" cy="712" r="25" fill="#158b9a"/>
  <text x="88" y="720" font-size="18" font-weight="800" fill="white">AI</text>
  <text x="145" y="705" class="card-title">Agent Hub</text>
  <text x="145" y="731" class="card-sub">Điều tra chỉ đọc · đang phát triển</text>
  <g>
    <rect x="84" y="758" width="150" height="51" rx="13" fill="#fff" stroke="#9ed4d8"/>
    <rect x="267" y="758" width="150" height="51" rx="13" fill="#fff" stroke="#9ed4d8"/>
    <rect x="450" y="758" width="150" height="51" rx="13" fill="#fff" stroke="#9ed4d8"/>
    <rect x="633" y="758" width="150" height="51" rx="13" fill="#fff" stroke="#9ed4d8"/>
    <text x="108" y="791" class="flow">Evidence</text>
    <text x="290" y="791" class="flow">Verifier</text>
    <text x="470" y="791" class="flow">Proposal</text>
    <text x="646" y="791" class="flow">Con người</text>
    <text x="241" y="791" class="flow" fill="#168c9b">→</text>
    <text x="424" y="791" class="flow" fill="#168c9b">→</text>
    <text x="607" y="791" class="flow" fill="#168c9b">→</text>
  </g>
  <text x="85" y="844" class="caption">Không ghi ledger, đơn hàng, tồn kho hoặc hạ tầng.</text>

  <!-- AKS platform -->
  <g filter="url(#shadow)"><rect x="850" y="664" width="740" height="211" rx="24" fill="#f0efff" stroke="#c7c1ec" stroke-width="2"/></g>
  <circle cx="894" cy="712" r="25" fill="#7663bb"/>
  <text x="875" y="720" font-size="18" font-weight="800" fill="white">PL</text>
  <text x="934" y="705" class="card-title">AKS-SRE-Platform</text>
  <text x="934" y="731" class="card-sub">Golden path cho OpsBridge và QuanLyKho</text>
  <rect x="875" y="758" width="329" height="46" rx="12" fill="#fff" stroke="#d3cdef"/>
  <rect x="1218" y="758" width="347" height="46" rx="12" fill="#fff" stroke="#d3cdef"/>
  <rect x="875" y="814" width="329" height="46" rx="12" fill="#fff" stroke="#d3cdef"/>
  <rect x="1218" y="814" width="347" height="46" rx="12" fill="#fff" stroke="#d3cdef"/>
  <text x="895" y="788" class="flow">Terraform · OIDC</text>
  <text x="1238" y="788" class="flow">Argo CD · Envoy Gateway</text>
  <text x="895" y="844" class="flow">Prometheus · Grafana</text>
  <text x="1238" y="844" class="flow">Alerts · Backup / DR</text>
  <rect x="1411" y="675" width="153" height="27" rx="13" fill="#ffe7c5"/>
  <text x="1427" y="694" class="badge" fill="#915512">AZURE PARTIAL</text>

  <text x="60" y="908" class="small">Nguồn: repo và bằng chứng hiện có · Nét liền: Ops/Quan trên Kind · Nét đứt: Hub read-only đang tích hợp · AKS cloud chưa hoàn tất.</text>
</svg>
