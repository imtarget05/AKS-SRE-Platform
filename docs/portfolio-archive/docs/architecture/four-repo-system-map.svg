<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="930" viewBox="0 0 1650 930" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc bốn repo Senior Engineering Portfolio</title>
  <desc id="desc">Retail Finance, OpsBridge FlashSale và QuanLyKho là ba miền nghiệp vụ. AKS SRE Platform cung cấp đường triển khai cho OpsBridge và QuanLyKho. Agent Hub đang phát triển, chỉ đọc chứng cứ và đề xuất để con người quyết định.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#193650" flood-opacity=".10"/></filter>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536c98"/></marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168c9b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#173047}
      .title{font-size:43px;font-weight:800;letter-spacing:-1.2px}
      .subtitle{font-size:22px;fill:#526c82}
      .card-title{font-size:29px;font-weight:800}
      .card-sub{font-size:18px;fill:#526c82}
      .component{font-size:23px;font-weight:650}
      .caption{font-size:18px;fill:#4e647a}
      .badge{font-size:15px;font-weight:800;letter-spacing:.9px}
      .flow{font-size:20px;font-weight:700}
      .small{font-size:17px;fill:#4d677c}
    </style>
  </defs>

  <rect width="1650" height="930" fill="#f6f9fd"/>
  <circle cx="1550" cy="50" r="180" fill="#eaf5f4" opacity=".75"/>
  <circle cx="60" cy="900" r="200" fill="#eaf0fc" opacity=".62"/>

  <text x="60" y="76" class="title">KIẾN TRÚC HỆ THỐNG 4 REPO</text>
  <text x="60" y="112" class="subtitle">Ba miền nghiệp vụ, một platform triển khai, một Hub điều tra chỉ đọc</text>
  <line x1="59" y1="144" x2="1592" y2="144" stroke="#d9e4ee" stroke-width="2"/>

  <g transform="translate(1140 82)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#536c98" stroke-width="4" marker-end="url(#arrowSolid)"/>
    <text x="70" y="6" class="small">Kind đã kiểm chứng</text>
    <line x1="0" y1="30" x2="55" y2="30" stroke="#168c9b" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowDash)"/>
    <text x="70" y="36" class="small">Hub đang tích hợp</text>
  </g>

  <!-- Cross-zone data and delivery paths, behind the cards -->
  <path d="M 295 552 C 295 612, 265 602, 265 658" fill="none" stroke="#168c9b" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrowDash)"/>
  <path d="M 825 552 C 825 615, 565 607, 565 658" fill="none" stroke="#168c9b" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrowDash)"/>
  <path d="M 1355 552 C 1355 618, 728 604, 728 658" fill="none" stroke="#168c9b" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrowDash)"/>
  <path d="M 905 552 C 905 606, 1093 613, 1093 658" fill="none" stroke="#536c98" stroke-width="4" marker-end="url(#arrowSolid)"/>
  <path d="M 1430 552 C 1430 610, 1407 612, 1407 658" fill="none" stroke="#536c98" stroke-width="4" marker-end="url(#arrowSolid)"/>

