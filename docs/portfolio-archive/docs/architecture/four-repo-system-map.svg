  <text x="145" y="219" class="card-title">Retail Finance</text>
  <text x="145" y="247" class="card-sub">Giao dịch và đối soát chính xác</text>
  <rect x="82" y="291" width="426" height="57" rx="13" fill="#f2f7ff" stroke="#d2e3fa"/>
  <text x="104" y="326" class="component">Java 17 · Spring Boot API</text>
  <rect x="82" y="358" width="426" height="57" rx="13" fill="#f2f7ff" stroke="#d2e3fa"/>
  <text x="104" y="393" class="component">Python · Reconciliation</text>
  <rect x="82" y="425" width="426" height="57" rx="13" fill="#f2f7ff" stroke="#d2e3fa"/>
  <text x="104" y="460" class="component">MySQL · Ledger chuẩn</text>
  <text x="83" y="516" class="caption">Partner feed → so khớp xác định</text>
