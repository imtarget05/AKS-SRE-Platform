  <rect x="1142" y="291" width="426" height="57" rx="13" fill="#f2fbf5" stroke="#d0eadb"/>
  <text x="1164" y="326" class="component">Flutter → FastAPI</text>
  <rect x="1142" y="358" width="426" height="57" rx="13" fill="#f2fbf5" stroke="#d0eadb"/>
  <text x="1164" y="393" class="component">PostgreSQL · Inventory</text>
  <rect x="1142" y="425" width="426" height="57" rx="13" fill="#f2fbf5" stroke="#d0eadb"/>
  <text x="1164" y="460" class="component">FEFO · Maker–Checker</text>
  <text x="1143" y="516" class="caption">AI chỉ tư vấn trên phiếu canonical</text>
  <rect x="1420" y="191" width="147" height="26" rx="13" fill="#c8e5d6"/>
  <text x="1436" y="209" class="badge" fill="#126443">KIND VERIFIED</text>

