  <text x="675" y="219" class="card-title">OpsBridge</text>
  <text x="675" y="247" class="card-sub">FlashSale · Đơn hàng và tồn dưới tải</text>
  <rect x="612" y="291" width="426" height="57" rx="13" fill="#fff8ef" stroke="#f5ddc2"/>
  <text x="634" y="326" class="component">.NET 10 · APIs</text>
  <rect x="612" y="358" width="426" height="57" rx="13" fill="#fff8ef" stroke="#f5ddc2"/>
