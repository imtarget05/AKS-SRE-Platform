  <g filter="url(#shadow)">
    <rect x="60" y="180" width="470" height="372" rx="24" fill="#fff" stroke="#b8d2f6" stroke-width="2"/>
    <path d="M 84 180 H 506 Q 530 180 530 204 V 271 H 60 V 204 Q 60 180 84 180 Z" fill="#e5f0ff"/>
  </g>
  <circle cx="105" cy="226" r="26" fill="#3b76cd"/>
