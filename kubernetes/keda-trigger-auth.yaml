# NOTE (P0.2 secret hygiene, 2026-09-21): the plaintext rabbitmq Secret that
# used to live at the top of this file was removed from git HEAD. Cluster
# secrets must not be committed; TriggerAuthentication consumes a Secret
# created out-of-band by External Secrets / Key Vault provider in a later
# phase (same pattern as keda-trigger-auth Service Bus target).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: flashsale
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-secret   # created at deploy time by External Secrets — never committed
    key: host

