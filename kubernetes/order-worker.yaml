apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: flashsale
  labels:
    app: order-worker
    project: flash-sale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: gcr.io/google-containers/pause:3.6
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
