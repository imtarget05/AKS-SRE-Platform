# Worker deployment cho AKS (Service Bus topology). KEDA scale theo queue depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: flashsale
  labels:
    app: order-worker
    project: flash-sale
spec:
  replicas: 1   # KEDA điều khiển (min 0, max 50 — xem keda-autoscaler.yaml)
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: acrflashsale-placeholder.azurecr.io/order-worker:latest  # kustomize override
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: pg-connection
            - name: ConnectionStrings__ServiceBus
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: servicebus-connection
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
