# Worker deployment cho AKS (Service Bus topology). KEDA scale theo queue depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: flashsale
  labels:
    app: order-worker
    project: flash-sale
spec:
  replicas: 1   # KEDA controls this (min 0, max 10 - see keda-autoscaler.yaml:9-10)
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: acrflashsalep6.azurecr.io/order-worker:e528d5a7503b4dd06a6646eb3f4b42ea23313d3e
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: pg-connection
            - name: ConnectionStrings__ServiceBus
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: servicebus-connection
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
