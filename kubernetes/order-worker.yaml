# Worker deployment cho AKS (Service Bus topology). KEDA scale theo queue depth.
# Demo image: nginx (lightweight, always-ready scale target for KEDA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: flashsale
  labels:
    app: order-worker
    project: flash-sale
spec:
  replicas: 1   # KEDA controls this (min 1, max 10 - see keda-autoscaler.yaml:9-10)
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
