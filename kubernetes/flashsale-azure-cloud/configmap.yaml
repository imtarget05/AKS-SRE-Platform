apiVersion: v1
kind: ConfigMap
metadata:
  name: flashsale-config
  namespace: flashsale
  labels:
    app: flashsale
    env: azure-cloud
data:
  SPRING_APPLICATION_NAME: "flashsale-payment-service"
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "demo,azure"
  SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  APP_JWT_EXPIRATION_MS: "86400000"
  GRPC_SERVER_ENABLED: "false"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://flashsale-db.postgres.database.azure.com:5432/FlashSaleDb"
  RABBITMQ_HOST: "rabbitmq.flashsale.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "flashsale-redis.eastasia.redis.azure.net"
  REDIS_PORT: "10000"
  REDIS_CONNECT_TIMEOUT: "1s"
  REDIS_COMMAND_TIMEOUT: "1s"
  MONGODB_URI: "mongodb://mongodb.flashsale.privatelink.mongo.azure.com:27017/flashsale_audit"
