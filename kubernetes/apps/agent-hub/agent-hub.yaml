apiVersion: v1
kind: Namespace
metadata:
  name: agent-hub
  labels:
    app.kubernetes.io/name: agent-hub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-hub-pvc
  namespace: agent-hub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-hub
  namespace: agent-hub
  labels:
    app.kubernetes.io/name: agent-hub
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: agent-hub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-hub
  namespace: agent-hub
  labels:
    app.kubernetes.io/name: agent-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-hub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: hub-persistent-storage
          persistentVolumeClaim:
            claimName: agent-hub-pvc
      containers:
        - name: agent-hub
          image: acrflashsalep6.azurecr.io/agent-hub:sha-agent-hub-v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AGENT_HUB_DB_PATH
              value: /var/lib/agent-hub/agent_hub.db
            - name: AGENT_HUB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-hub-secret
                  key: jwt-secret
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ENVIRONMENT
              value: "production"
            - name: RETAIL_SERVICE_URL
              value: "http://retail-core.retail-finance.svc.cluster.local:8080"
            - name: FLASH_SALE_ORDER_API_URL
              value: "http://order-api.flashsale.svc.cluster.local:80"
            - name: OPSBRIDGE_AGENT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-hub-secret
                  key: opsbridge-agent-hmac-key
            - name: FLASH_SALE_READ_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-hub-secret
                  key: opsbridge-read-bearer-token
            - name: QUANLYKHO_SERVICE_URL
              value: "http://bankops-api.quanlykho.svc.cluster.local:8000"
            - name: QUANLYKHO_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-hub-secret
                  key: quanlykho-jwt-key
            - name: PROMETHEUS_URL
              value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          volumeMounts:
            - name: hub-persistent-storage
              mountPath: /var/lib/agent-hub
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-hub-pdb
  namespace: agent-hub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-hub
