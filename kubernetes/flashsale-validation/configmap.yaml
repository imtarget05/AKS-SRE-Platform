apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: validation
  labels:
    app: payment-service
    env: validation
data:
  SPRING_APPLICATION_NAME: "payment-service"
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "demo"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
  APP_JWT_EXPIRATION_MS: "86400000"
  GRPC_SERVER_ENABLED: "false"
  POSTGRES_JDBC_URL: "jdbc:postgresql://postgres.validation.svc.cluster.local:5432/FlashSaleDb"
  RABBITMQ_HOST: "rabbitmq.validation.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  REDIS_HOST: "redis.validation.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_CONNECT_TIMEOUT: "1s"
  REDIS_COMMAND_TIMEOUT: "1s"
