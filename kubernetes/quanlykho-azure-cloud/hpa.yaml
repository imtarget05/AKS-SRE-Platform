apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quanlykho-hpa
  namespace: quanlykho
  labels:
    app: quanlykho
    env: azure-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quanlykho
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
