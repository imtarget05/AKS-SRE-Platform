apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flashsale-workload-rules
  namespace: monitoring
  labels:
    release: prometheus
    role: alert-rules
    app.kubernetes.io/part-of: flashsale
spec:
  groups:
    - name: flashsale.workload.alerts
      rules:
        - alert: FlashSaleHigh5xxRate
          expr: >-
            (sum(rate(http_requests_received_total{namespace="flashsale",code=~"5.."}[5m]))
            /
            sum(rate(http_requests_received_total{namespace="flashsale"}[5m])) > 0.05)
          for: 2m
          labels:
            severity: critical
            team: flashsale-sre
          annotations:
            summary: "FlashSale Order API 5xx rate exceeds 5%"
            description: "Over 5% of incoming HTTP requests to Order.Api returned 5xx server errors in the last 5 minutes."

        - alert: FlashSaleOrderWorkerRestarts
          expr: >-
            increase(kube_pod_container_status_restarts_total{namespace="flashsale",container="order-worker"}[15m]) > 3
          for: 1m
          labels:
            severity: warning
            team: flashsale-sre
          annotations:
            summary: "Order.Worker pod restarting frequently"
            description: "The order-worker consumer container restarted more than 3 times in 15 minutes, indicating potential crash loop or OOM."

        - alert: FlashSaleOutboxProcessingStuck
          expr: >-
            flashsale_outbox_pending_messages{namespace="flashsale"} > 50
          for: 3m
          labels:
            severity: warning
            team: flashsale-sre
          annotations:
            summary: "FlashSale outbox dispatcher queue backing up"
            description: "More than 50 outbox messages have remained in PENDING status for longer than 3 minutes."
