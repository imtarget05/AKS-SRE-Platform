# L10.2 — dashboard 2/3: GitOps state straight from Argo CD's own metrics
# (scraped by platform/observability/argocd-servicemonitor.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gitops-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    platform.local/component: observability
data:
  gitops-argocd.json: |
    {
      "uid": "gitops-argocd",
      "title": "GitOps / Argo CD",
      "tags": ["local-platform", "gitops", "argocd"],
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Applications OutOfSync",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            { "refId": "A", "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"})", "legendFormat": "OutOfSync" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Applications not Healthy",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "targets": [
            { "refId": "A", "expr": "sum(argocd_app_info{health_status!=\"Healthy\"})", "legendFormat": "unhealthy" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Applications by sync status",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "count by (sync_status) (argocd_app_info)", "legendFormat": "{{sync_status}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Applications by health status",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "count by (health_status) (argocd_app_info)", "legendFormat": "{{health_status}}" }
          ]
        }
      ]
    }
