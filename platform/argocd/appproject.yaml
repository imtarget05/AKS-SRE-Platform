# L9 — the ONE AppProject for the maintained portfolio applications.
#
# Least privilege on purpose: no `*` sourceRepos, no `*` destinations. An
# Application in this project can only deploy the maintained portfolio
# repositories into their own namespaces on the in-cluster API server. Anything else is
# rejected by the Application controller, not by convention.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
  annotations:
    # Keep the project itself out of the "orphan" cleanup window during
    # bootstrap ordering (project must exist before its Applications).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Maintained portfolio workloads (CreditFlow and QuanLyKho).

  # CreditFlow and QuanLyKho own their workload namespaces. P03 (this repo)
  # owns the cluster-scoped platform (Envoy Gateway, AppProject, Applications).
  sourceRepos:
    - https://github.com/imtarget05/CreditFlow.git
    - https://github.com/imtarget05/AKS-SRE-Platform.git
    - https://github.com/imtarget05/QuanLyKho.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: quanlykho
    - server: https://kubernetes.default.svc
      namespace: portfolio
    - server: https://kubernetes.default.svc
      namespace: flashsale

  # Namespaced resources: the two workload repos carry Deployments, StatefulSets,
  # Jobs, Services, ConfigMaps, Secrets and HTTPRoutes. kubernetes/ also carries
  # a Namespace (cluster-scoped, whitelisted below) and KEDA ScaledObject +
  # TriggerAuthentication (namespaced, whitelisted below).
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: autoscaling
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: keda.sh
      kind: ScaledObject
    - group: keda.sh
      kind: TriggerAuthentication

  # Namespace is cluster-scoped; whitelist it explicitly so Argo CD can create
  # the target namespace. No clusterResourceBlacklist: whitelist alone controls
  # which cluster-scoped resources are permitted (Namespace only).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
