# L9 — OpsBridge (FlashSale workload) under GitOps.
#
# Source of truth is the repository, not this laptop: Argo builds
# infrastructure/kubernetes/overlays/azure-cloud with Kustomize and reconciles the
# flashsale namespace. The repository is public, so no repository credential
# is stored anywhere in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flashsale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/imtarget05/OpsBridge.git
    targetRevision: b6a2436a31f0378cc3badf3fd81c97c81019e2b2
    path: infrastructure/kubernetes/overlays/azure-cloud

  destination:
    server: https://kubernetes.default.svc
    namespace: flashsale

  syncPolicy:
    # Manual first cutover: automated sync disabled until initial promotion is reviewed
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Ignore controller-added Job labels when comparing the pre-existing
    # FlashSale migration Job. OpsBridge's own migration runs separately.
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels/controller-uid
        - /spec/template/metadata/labels/batch.kubernetes.io~1controller-uid
