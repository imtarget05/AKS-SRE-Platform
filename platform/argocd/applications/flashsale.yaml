# L9 — OpsBridge (FlashSale workload) under GitOps.
#
# Source of truth is the repository, not this laptop: Argo builds
# infrastructure/kubernetes/overlays/local with Kustomize and reconciles the
# flashsale namespace. The repository is public, so no repository credential
# is stored anywhere in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flashsale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/imtarget05/OpsBridge.git
    targetRevision: 3e7fb0d30dd2a5caffd3a7b9c73ec24367e11bf0
    path: infrastructure/kubernetes/overlays/azure-cloud

  destination:
    server: https://kubernetes.default.svc
    namespace: flashsale

  syncPolicy:
    # Manual first cutover: automated sync disabled until initial promotion is reviewed
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The migration Job is a PreSync hook with a fixed name; a completed Job
    # must not be recreated on every sync just because its generated
    # pod-template-hash label differs.
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels/controller-uid
        - /spec/template/metadata/labels/batch.kubernetes.io~1controller-uid
