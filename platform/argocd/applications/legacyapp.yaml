# L9 — Productionized-LegacyApp (P02) under GitOps — EXTERNAL workload.
#
# Source of truth is the external Productionized-LegacyApp repository; this
# platform holds only a GitOps reference (ADR-015). No credential is stored
# for the public repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: legacyapp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/imtarget05/Productionized-LegacyApp.git
    targetRevision: 885d2ec3a2672416404082e3736de80855052928
    path: infrastructure/kubernetes/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: legacyapp

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
