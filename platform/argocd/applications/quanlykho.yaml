# QuanLyKho Operations under GitOps.
#
# Same golden path contract as flashsale: public repo as source of truth,
# Argo CD builds overlays/local with Kustomize and reconciles the quanlykho namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quanlykho
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio

  source:
    repoURL: https://github.com/imtarget05/QuanLyKho.git
    targetRevision: aebfd708d7b8ab73f52e28e3afeb03cc41c19065
    path: infra/k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: quanlykho

  syncPolicy:
    # Manual first cutover: automated sync disabled until initial promotion is reviewed
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: bankops-frontend
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: cloudflare-tunnel
      jsonPointers:
        - /spec/replicas
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels/controller-uid
        - /spec/template/metadata/labels/batch.kubernetes.io~1controller-uid
