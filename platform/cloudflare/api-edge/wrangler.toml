name = "portfolio-api-edge"
main = "src/index.mjs"
compatibility_date = "2026-10-24"
workers_dev = true

[vars]
AZURE_ORIGIN_URL = "https://portfolio-aks-origin-20261025.eastasia.cloudapp.azure.com/"
ALLOWED_ORIGINS = "https://opsbridge-dashboard.pages.dev,https://quan-ly-kho-tra-sua.pages.dev"

[[mtls_certificates]]
binding = "AZURE_ORIGIN"
certificate_id = "c4145574-62d9-4bb8-bbab-25ca3f83339f"

[[ratelimits]]
name = "RATE_ORDER"
namespace_id = "1001"
[ratelimits.simple]
limit = 100
period = 10

[[ratelimits]]
name = "RATE_AUTH"
namespace_id = "1002"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "RATE_AI"
namespace_id = "1003"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RATE_STAFF"
namespace_id = "1004"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "RATE_GENERAL"
namespace_id = "1006"
[ratelimits.simple]
limit = 100
period = 10
