# L3 — TEMPORARY proof route. Deleted after the traffic proof is captured
# (see platform/envoy-gateway/README.md), because L5/L8 replace it with the real
# P01/P02 routes. The Gateway and GatewayClass above are kept.
#
# Path-prefix routing is used on purpose: it exercises the same routing
# mechanism the shared Gateway will use in L8, instead of a trivial "/" match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-proof
  namespace: platform-gateway
  labels:
    purpose: l3-temporary-proof
spec:
  parentRefs:
    - name: portfolio-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /proof
      backendRefs:
        - name: gateway-proof
          port: 80
