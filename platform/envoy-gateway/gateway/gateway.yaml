# L3 — the portfolio's shared north-south Gateway (kept beyond L3; L8 attaches
# P01 and P02 HTTPRoutes to this same Gateway).
#
# This file is the desired state in Git. It is independent of the ephemeral
# proof backend, so removing the proof does not remove the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio-gateway
  namespace: platform-gateway
spec:
  gatewayClassName: portfolio-gatewayclass
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Same-namespace only: the proof route and (later) shared platform routes
      # live here. Cross-namespace attachment would need ReferenceGrants, which
      # are deliberately NOT opened for a local proof.
      allowedRoutes:
        namespaces:
          from: Same
