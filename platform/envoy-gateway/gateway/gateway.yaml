# L3 — the portfolio's shared north-south Gateway (kept beyond L3; L8 attaches
# P01 and P02 HTTPRoutes to this same Gateway).
#
# This file is the desired state in Git. It is independent of the ephemeral
# proof backend, so removing the proof does not remove the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: portfolio-gateway
  namespace: platform-gateway
spec:
  gatewayClassName: portfolio-gatewayclass
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # L8: routes now live IN each application namespace (flashsale/legacyapp)
      # so every repo owns its own HTTPRoute and backendRefs stay same-namespace
      # (no ReferenceGrants needed). Cross-namespace parent attachment is allowed
      # by the Gateway; backendRefs never cross a namespace boundary.
      allowedRoutes:
        namespaces:
          from: All
