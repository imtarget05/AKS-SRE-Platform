# L3 — mTLS CA certificate for the shared north-south Gateway (portfolio-gateway).
#
# Self-signed placeholder CA cert for the local kind cluster. Replace with a
# real CA (e.g. issued by your internal PKI or cert-manager) before any
# non-demo workload. Only the TLS certificate/key pair is stored here; the
# Gateway listener below references this Secret for TLS termination.
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-mtls-ca
  namespace: platform-gateway
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
