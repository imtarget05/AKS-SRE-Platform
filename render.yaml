services:
  - type: web
    name: sre-demo-api
    runtime: docker
    dockerfilePath: app/sre-demo-api/Dockerfile
    dockerContext: app/sre-demo-api
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: OTEL_SERVICE_NAME
        value: sre-demo-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
