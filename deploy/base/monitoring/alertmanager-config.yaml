apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-webhook'
      routes:
        - match:
            severity: critical
          receiver: 'critical-webhook'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-webhook'
    receivers:
      - name: 'default-webhook'
        webhook_configs:
          - url: 'http://alert-receiver.monitoring.svc:9095/alerts'
            send_resolved: true
      - name: 'critical-webhook'
        webhook_configs:
          - url: 'http://alert-receiver.monitoring.svc:9095/alerts/critical'
            send_resolved: true
      - name: 'warning-webhook'
        webhook_configs:
          - url: 'http://alert-receiver.monitoring.svc:9095/alerts/warning'
            send_resolved: true
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['service']