apiVersion: v1
kind: Service
metadata:
  name: sre-demo-api
  labels:
    app.kubernetes.io/name: sre-demo-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sre-demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# The mock dependency is a separate pod, not an in-process stub. That is
# deliberate: a real HTTP hop is what produces a genuine child span, so trace
# propagation can be demonstrated instead of asserted. It also gives
# NetworkPolicy something to allow and deny.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-dependency
  labels:
    app.kubernetes.io/name: mock-dependency
    app.kubernetes.io/part-of: aks-sre-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-dependency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-dependency
        app.kubernetes.io/part-of: aks-sre-platform
    spec:
      serviceAccountName: mock-dependency
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mock-dependency
      terminationGracePeriodSeconds: 30
      containers:
        - name: mock-dependency
          image: sre-demo-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: OTEL_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-dependency
  labels:
    app.kubernetes.io/name: mock-dependency
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-dependency
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Separate ServiceAccounts, deliberately. `automountServiceAccountToken: false`
# plus an explicit annotation means neither pod holds a Kubernetes API token,
# and each future Workload Identity binding (Phase J) has a distinct subject to
# allow or deny. Two apps sharing one ServiceAccount would make the identity
# negative control meaningless.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-demo-api
  labels:
    app.kubernetes.io/name: sre-demo-api
  # No annotations yet. The `azure.workload.identity/client-id` annotation is
  # added by the Phase J overlay once a user-assigned managed identity exists.
  # Pointing it at an identity that does not exist would produce a pod that
  # starts fine and fails every Azure call, which is worse than not claiming
  # workload identity at all.
  annotations: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-dependency
  labels:
    app.kubernetes.io/name: mock-dependency
  annotations: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-demo-api-config
  labels:
    app.kubernetes.io/name: sre-demo-api
data:
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  DEPENDENCY_URL: "http://mock-dependency:80"
  DEPENDENCY_TIMEOUT_MS: "2000"
  DEPENDENCY_LATENCY_MS: "5"
  # Readiness depends on the dependency, so a dependency failure is observable
  # as un-ready pods that the Service stops routing to. Liveness deliberately
  # does not (see the livenessProbe) — a slow dependency must drain traffic, not
  # trigger a cluster-wide restart loop.
  READINESS_REQUIRES_DEPENDENCY: "true"
  # Disarmed by default. Only an overlay that explicitly opts in can arm
  # /api/fail, so a prod overlay built from base cannot expose it.
  FAILURE_INJECTION_ARMED: "false"
  # Overridden per environment. Empty in base: an unconfigured collector must not
  # be assumed to exist, and traces must degrade rather than block startup.
  otlp-endpoint: ""
