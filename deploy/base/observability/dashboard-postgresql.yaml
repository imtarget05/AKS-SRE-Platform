apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgresql
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgresql-golden-signals.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Active Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "pg_stat_activity_count",
              "legendFormat": "active connections",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Idle in Transaction",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "pg_stat_activity_idle_in_transaction_count",
              "legendFormat": "idle in transaction",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Lock Waits",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "pg_locks_waiting_count",
              "legendFormat": "lock waits",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Transactions by State",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "pg_stat_activity_count by (state)",
              "legendFormat": "{{state}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Query Duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(pg_query_duration_seconds_bucket[5m])))",
              "legendFormat": "p95 query duration",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["postgresql", "database", "observability"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "PostgreSQL Database — Golden Signals",
      "uid": "postgresql-golden-signals",
      "version": 1
    }