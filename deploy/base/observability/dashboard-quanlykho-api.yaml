apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-quanlykho-api
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  quanlykho-api-golden-signals.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Requests per Second (RPS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(quanlykho_http_requests_total[5m]))",
              "legendFormat": "RPS",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Latency p95 (seconds)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(quanlykho_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Error Rate 5xx",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(quanlykho_http_requests_total{status_class=\"5xx\"}[5m])) / sum(rate(quanlykho_http_requests_total[5m]))",
              "legendFormat": "5xx rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Requests In Flight",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "quanlykho_http_requests_in_flight",
              "legendFormat": "in flight",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Requests by Status Class",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(quanlykho_http_requests_total[5m])) by (status_class)",
              "legendFormat": "{{status_class}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Duration Histogram",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(quanlykho_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(quanlykho_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["api", "quanlykho", "fastapi"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "QuanLyKho API — Golden Signals",
      "uid": "quanlykho-api-golden-signals",
      "version": 1
    }