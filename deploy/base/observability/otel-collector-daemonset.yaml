---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
data:
  otel-collector-config.yaml: "receivers:\n  prometheus:\n    config:\n      scrape_configs:\n\
    \        - job_name: otel-collector-scrape-prometheus\n          honor_labels:\
    \ true\n          scrape_interval: 30s\n          static_configs:\n          \
    \  - targets:\n                - prometheus-operated.monitoring.svc.cluster.local:9090\n\
    \  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n\
    \  memory_limiter:\n    limit_mib: 512\n    spike_limit_mib: 128\n    check_interval:\
    \ 1s\n  batch:\n    timeout: 5s\n    send_batch_max_size: 1024\nexporters:\n \
    \ prometheus:\n    # Exported back to Prometheus: Prometheus scrapes :9464/metrics.\n\
    \    endpoint: 0.0.0.0:9464\n  prometheusremotewrite:\n    # Remote-write into\
    \ the cluster Prometheus.\n    endpoint: http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write\n\
    \  logging:\n    loglevel: debug\nservice:\n  pipelines:\n    metrics:\n     \
    \ receivers: [prometheus, otlp]\n      processors: [memory_limiter, batch]\n \
    \     exporters: [prometheus, prometheusremotewrite, logging]\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: aks-sre-platform
    spec:
      serviceAccountName: otel-collector
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.102.0
        command:
        - /otelcol-contrib
        args:
        - --config=/etc/otel-collector/otel-collector-config.yaml
        ports:
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: prometheus
          containerPort: 9464
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otel-collector
          readOnly: true
        livenessProbe:
          httpGet:
            path: /metrics
            port: prometheus
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: prometheus
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /metrics
            port: prometheus
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app: otel-collector
  ports:
  - name: prometheus
    port: 9464
    targetPort: 9464
  type: ClusterIP
