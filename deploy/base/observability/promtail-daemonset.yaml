apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: aks-sre-platform
    spec:
      serviceAccountName: loki-promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.0.1
          args:
            - -config=/etc/promtail/promtail.yaml
            - -config.expand-env=true
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdocker
              mountPath: /var/lib/docker
              readOnly: true
            - name: containerlogs
              mountPath: /var/lib/containerd
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9080
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdocker
          hostPath:
            path: /var/lib/docker
        - name: containerlogs
          hostPath:
            path: /var/lib/containerd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: aks-sre-platform
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    clients:
      - url: http://loki.monitoring.svc:3100/loki/api/v1/push
        tenant_id: ""
    scrape_configs:
      - job_name: kubernetes-pods-names
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_container_name
            target_label: container
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels:
              - __meta_kubernetes_pod_annotation_loglevel
            target_label: log_level
          - source_labels:
              - __meta_kubernetes_pod_annotation_io_kubernetes_container_init
            target_label: container_init
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            target_label: container_port
