---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: aks-sre-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: aks-sre-platform
    spec:
      serviceAccountName: loki-promtail
      containers:
      - name: promtail
        image: grafana/promtail:3.0.1
        args:
        - -config=/etc/promtail/promtail.yaml
        - -config.expand-env=true
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdocker
          mountPath: /var/lib/docker
          readOnly: true
        - name: containerlogs
          mountPath: /var/lib/containerd
          readOnly: true
        ports:
        - name: metrics
          containerPort: 9080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdocker
        hostPath:
          path: /var/lib/docker
      - name: containerlogs
        hostPath:
          path: /var/lib/containerd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: promtail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: aks-sre-platform
data:
  promtail.yaml: "server:\n  http_listen_port: 9080\n  grpc_listen_port: 0\nclients:\n\
    \  - url: http://loki.monitoring.svc:3100/loki/api/v1/push\n    tenant_id: \"\"\
    \nscrape_configs:\n  - job_name: kubernetes-pods-names\n    kubernetes_sd_configs:\n\
    \      - role: pod\n    relabel_configs:\n      - source_labels:\n          -\
    \ __meta_kubernetes_namespace\n        target_label: namespace\n      - source_labels:\n\
    \          - __meta_kubernetes_pod_name\n        target_label: pod\n      - source_labels:\n\
    \          - __meta_kubernetes_container_name\n        target_label: container\n\
    \      - source_labels:\n          - __meta_kubernetes_pod_node_name\n       \
    \ target_label: node\n      - action: labelmap\n        regex: __meta_kubernetes_pod_label_(.+)\n\
    \      - source_labels:\n          - __meta_kubernetes_pod_annotation_loglevel\n\
    \        target_label: log_level\n      - source_labels:\n          - __meta_kubernetes_pod_annotation_io_kubernetes_container_init\n\
    \        target_label: container_init\n      - source_labels:\n          - __meta_kubernetes_pod_container_port_number\n\
    \        target_label: container_port\n"
