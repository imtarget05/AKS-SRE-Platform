apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml        # ServiceAccounts, ConfigMap, Services, mock dependency
  - deployment.yaml     # sre-demo-api Deployment
  - autoscaling.yaml    # HPA + PodDisruptionBudget
  - networkpolicy.yaml  # default-deny + explicit allows
  - observability/servicemonitor-envoy-gateway.yaml   # Envoy Gateway metrics scrape
  - observability/flashsale-workload-prometheusrule.yaml  # FlashSale workload alerts
  - observability/local-platform-prometheusrule.yaml   # Platform alerts
  - observability/argocd-servicemonitor.yaml          # Argo CD metrics scrape (canonical, part-of selector)

labels:
  - pairs:
      app.kubernetes.io/part-of: aks-sre-platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
